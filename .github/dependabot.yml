version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
